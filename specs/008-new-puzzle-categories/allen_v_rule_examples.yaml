# Allen V-rule worked example movestrings
# Verified with visualize_board.sh + c4solver on 2026-05-18.
#
# V-rule summary:
#   V1: Red wins — ≥3 Red odd-row threats in separate cols after T1–T7
#   V2: Black wins — ≥2 Black odd-row threats in separate cols after T1–T7
#   V3: Red wins — exactly 1 Red odd-row threat, 0 Black odd-row threats after T1–T7
#   V4: Black wins — Black even-row threat, no odd threats either side after T1–T7
#   V5: Draw — no surviving threats after T1–T7

allen_v_rule_examples:
  v5:
    movestring: "42354643256425346355663"
    hard: false
    last_failure: ""
    description: "Draw: no surviving threats after T1–T7"
    verification:
      major_threats:
        - col: 1
          row: 3
          player: Red
          parity: odd
        - col: 7
          row: 5
          player: Yellow
          parity: odd
      t7_cancellations: "col1-row3(R) + col7-row5(Y) → both cancelled (separate columns)"
      scr: [0, 0, 0, 0, 0, 0, 0]
      par: [6E, 3O, 1O, 1O, 1O, 1O, 6E]
      surviving_threats_after_t7: []

  v3:
    movestring: "77273746"
    hard: false
    last_failure: ""
    description: "Red wins: 1 Red odd-row threat, 0 Black odd-row threats after T1–T7"
    verification:
      major_threats:
        - col: 1
          row: 1
          player: Red
          parity: odd
        - col: 5
          row: 1
          player: Red
          parity: odd
        - col: 7
          row: 5
          player: Yellow
          parity: odd
      t7_cancellations: "col5-row1(R) + col7-row5(Y) → both cancelled (separate columns)"
      scr: [17, -17, -17, -17, 17, -17, 16]
      par: [6E, 5O, 5O, 5O, 6E, 5O, 2E]
      surviving_threats_after_t7:
        - col: 1
          row: 1
          player: Red
          parity: odd
      v_rule_fires: V3

